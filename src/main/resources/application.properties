spring.application.name=Webaccess
server.port = 8081

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=monecheck;encrypt=true;trustServerCertificate=true
spring.datasource.username=monecheck
spring.datasource.password=monecheck

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


domain.codeBanque=004

app.parameters-file=${APP_PARAMETERS_FILE:classpath:config/paramApprove.xml}
app.parameters-section=general

carte.retrait=4
carte.paiement=5

carte.operation.gab=040
carte.operation.tpe=050
carte.operation.remboursement=051

carte.etat.attente=6
carte.etat.valide=3

carte.devise=DZD


# ==========================================
# LEGACY OPERATION TYPE CODES (param.xml)
# ==========================================

webaccess.operation-types.card-payment=5
webaccess.operation-types.card-withdrawal=4
webaccess.operation-types.cheque=3
webaccess.operation-types.effect=6
webaccess.operation-types.direct-debit=2
webaccess.operation-types.transfer=1
webaccess.operation-types.p-mobile=7


# Virement operation subtypes
virement.operation.client=010
virement.operation.bab=011
virement.operation.etr=012

# Virement states
virement.etat.attente=6
virement.etat.valide=3

# Validation event initial state
virement.etat.validation.source=6


# SQL queries
logging.level.org.hibernate.SQL=DEBUG

# SQL parameter values
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Optional: Hibernate query diagnostics
logging.level.org.hibernate.orm.jdbc.extract=TRACE