spring.application.name=Webaccess


# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=monecheck;encrypt=true;trustServerCertificate=true
spring.datasource.username=monecheck
spring.datasource.password=monecheck

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Additional database: numerise

app.datasource.numerise.jdbc-url=jdbc:sqlserver://localhost:1433;databaseName=NumeriseAGB;encrypt=true;trustServerCertificate=true
app.datasource.numerise.username=monecheck
app.datasource.numerise.password=monecheck